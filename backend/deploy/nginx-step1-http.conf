
# ───── Flavourly API (flavourly.dakshyaminfotech.store) — step 1: HTTP + certificate challenge ─────
# Appended to /etc/nginx/sites-available/centillion. Answers ONLY for flavourly.dakshyaminfotech.store,
# so every existing site in the file is unaffected. All names start with "flavourly_" to avoid clashes.
server {
    listen 80;
    server_name flavourly.dakshyaminfotech.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/flavourly-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
