
# ───── Flavourly API — step 2: HTTPS reverse proxy to PM2 (append after the certificate exists) ─────
# Horizontal scaling: add one `server` line per extra machine running the same API.
upstream flavourly_api_upstream {
    server 127.0.0.1:4815 max_fails=3 fail_timeout=10s;
    # server 10.0.0.12:4815 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Per-client request rate in front of Node (Node also limits per device, shared through Redis).
limit_req_zone $binary_remote_addr zone=flavourly_api_rl:10m rate=30r/s;

server {
    # No http2 flag here: on a shared IP:443 it would switch HTTP/2 on for every other site too.
    listen 443 ssl;
    server_name flavourly.dakshyaminfotech.store;

    ssl_certificate     /etc/letsencrypt/live/flavourly.dakshyaminfotech.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flavourly.dakshyaminfotech.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:flavourly_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    access_log /var/log/nginx/flavourly.access.log;
    error_log  /var/log/nginx/flavourly.error.log warn;

    # Generated recipe photos are plain files: Nginx serves them directly.
    location /images/ {
        alias /var/www/dakshyaminfotech/flavourly/backend/public/images/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        limit_req zone=flavourly_api_rl burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://flavourly_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;   # AI imports can take 30–60 s
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
