<h1>Grandma's lentil soup</h1>
<p>Ingredients</p>
<ul><li>200 g red lentils</li><li>1 onion</li><li>1 litre stock</li></ul>
<p>Method</p>
<ol><li>1. Fry the onion for 5 min</li><li>2. Add lentils and stock, simmer 20 min</li></ol>
